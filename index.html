<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linknode</title>
<meta name="description" content="Linknode — 非エンジニアにも届くアプリづくり。IT用語辞典「IT Logic」などを開発しています。" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #20264a 0%, #101820 55%, #0b1016 100%);
    color: #eaf2fb; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Segoe UI, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 32px;
  }
  .card { width: 100%; max-width: 560px; text-align: center; }
  .logo {
    font-size: 40px; font-weight: 800; letter-spacing: .02em; margin: 0 0 8px;
    background: linear-gradient(90deg,#7aa2ff,#afe0ff); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { color: #aebfd4; margin: 0 0 32px; font-size: 15px; }
  .apps { display: grid; gap: 14px; margin: 0 0 32px; }
  .app {
    display: block; text-decoration: none; color: inherit; text-align: left;
    border: 1px solid rgba(255,255,255,.10); border-radius: 16px; padding: 18px 20px;
    background: rgba(255,255,255,.035); transition: border-color .2s, background .2s;
  }
  .app:hover { border-color: rgba(122,162,255,.5); background: rgba(122,162,255,.07); }
  .app h2 { margin: 0 0 4px; font-size: 17px; }
  .app p { margin: 0; color: #9fb0c6; font-size: 13px; }
  .contact { color: #aebfd4; font-size: 14px; }
  .contact a { color: #afe0ff; }
  footer { margin-top: 28px; color: #6b7c93; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <h1 class="logo">Linknode</h1>
    <p class="tagline">非エンジニアにも届く、小さく実用的なアプリを作っています。</p>
    <div class="apps">
      <a class="app" href="https://linknode9.github.io/it-logic-privacy/">
        <h2>IT Logic — IT用語辞典</h2>
        <p>比較でわかる。生成AI・最新用語に対応したオフライン辞書。</p>
      </a>
    </div>
    <p class="contact">お問い合わせ：<a href="mailto:support@linknode.dev">support@linknode.dev</a></p>
    <footer>© 2026 Linknode</footer>
  </main>
</body>
</html>
